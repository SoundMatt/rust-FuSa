[package]
name = "rsfusa"
version = "0.2.5"
edition = "2021"
description = "rust-FuSa: functional safety toolkit for Rust projects"
license = "MPL-2.0"
repository = "https://github.com/SoundMatt/rust-FuSa"
homepage = "https://github.com/SoundMatt/rust-FuSa"
keywords = ["functional-safety", "iso26262", "iec61508", "safety", "fusa"]
categories = ["development-tools", "command-line-utilities"]
rust-version = "1.75"

[[bin]]
name = "rsfusa"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
glob = "0.3"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"
toml = "0.8"
tempfile = "3"
hmac = "0.12"

[dev-dependencies]

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
